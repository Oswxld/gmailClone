name: gmail_clone
description: A clearly identified Android mail UI demonstration, backed by a shared Supabase project.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2



flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/OIP.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/OIP.png"


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  flutter_dotenv: ^6.0.1
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  supabase_flutter: ^2.18.2
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/messages_icons/
